# Grafana dashboard provisioning for the F.Feccia TMS stack.
#
# Tells Grafana to load every .json dashboard under this same directory's
# `files/` subfolder on startup — no manual "Import" step needed, and the
# dashboards live in git alongside the rest of the observability config.

apiVersion: 1

providers:
  - name: 'F.Feccia'
    orgId: 1
    folder: 'F.Feccia'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/files
