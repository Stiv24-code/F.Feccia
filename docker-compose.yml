# docker-compose.yml — stack locale, autosufficiente (nessun file -f aggiuntivo).
#
# Uso:
#   cp .env.example .env
#   # modificare .env
#   docker compose up -d --build

#
# Servizi: nginx (frontend statico + reverse proxy, senza TLS — uso locale) →
# backend-go → postgres. Backend Python (Motor/MongoDB) rimosso dopo il
# completamento del porting Go (vedi CLAUDE.md).
#
# In produzione si usa `docker-compose.prod.yml` sopra questo file (immagini
# da registry, certificati Let's Encrypt, restart=always) — quel file non è
# stato ancora allineato al cutover Go (referenzia ancora backend/mongo/redis
# Python), da rivedere quando si affronta il deploy reale.



services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In dev lasciamo vuota: la SPA usa URL relativo /api proxy-ato da nginx.
        # In prod impostiamo al dominio API reale (es. https://api.tms.example.com) per evitare doppio hop.
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    image: tms-frontend:dev
    # frontend/nginx/default.conf (nell'immagine) richiede certificati Let's
    # Encrypt e non parte in locale — questo mount lo sostituisce con
    # dev.conf (nessun TLS, instrada su backend-go) per uso standalone.
    volumes:
      - ./frontend/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend-go:
        condition: service_started
    restart: unless-stopped
    networks:
      - tms

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${GO_DB_USER:-loginbusiness}
      POSTGRES_PASSWORD: ${GO_DB_PASSWORD:?set GO_DB_PASSWORD in .env}
      POSTGRES_DB: ${GO_DB_NAME:-loginbusiness}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GO_DB_USER:-loginbusiness}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tms

  backend-go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tms-backend-go:dev
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${GO_DB_USER:-loginbusiness}
      DB_PASSWORD: ${GO_DB_PASSWORD:?set GO_DB_PASSWORD in .env}
      DB_NAME: ${GO_DB_NAME:-loginbusiness}
      DB_SSLMODE: disable
      JWT_ACCESS_SECRET: ${GO_JWT_ACCESS_SECRET:?set GO_JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${GO_JWT_REFRESH_SECRET:?set GO_JWT_REFRESH_SECRET in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@feccia.it}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      # IS_LOCAL=true: al primo avvio su un DB vuoto semina il dataset demo
      # completo (internal/seeddemo), non solo un admin nudo — vedi
      # internal/app/seed.go. Da NON impostare così in produzione.
      IS_LOCAL: "true"
      # Opzionale: senza chiave il routing (percorsi ordine, segmenti
      # viaggio, poligonale mappa) degrada a nil, nessun errore — vedi
      # internal/services/geo.GeoService.
      ORS_API_KEY: ${ORS_API_KEY:-}
      # api.openrouteservice.org e api.heigit.org sono lo stesso backend, ma
      # non sempre ugualmente raggiungibili da ogni rete/host — override qui
      # se dal tuo ambiente solo uno dei due domini risolve/passa il traffico.
      ORS_BASE_URL: ${ORS_BASE_URL:-https://api.openrouteservice.org}
    ports:
      - "${GO_BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tms

volumes:
  postgres_data:

networks:
  tms:
    driver: bridge
