# Nginx config unico: serve SPA React statica + reverse proxy /api → backend.
#
# Due server block:
#   - HTTP (80): gestisce ACME HTTP-01 challenge di certbot e redirige tutto
#     il resto su HTTPS. In dev usiamo solo questo (no certificati).
#   - HTTPS (443): terminazione TLS + hardening + SPA + proxy /api.
#
# I certificati sono montati da /etc/letsencrypt/live/tms.wheretech.it
# (certbot sull'host EC2 — issue #16). Il certificato è unico per entrambi
# i FQDN (tms.wheretech.it + api.tms.wheretech.it) via SAN.
#
# Per eseguire in locale senza TLS (docker compose dev), il file-path dei
# certificati non esiste e il server 443 va commentato o l'immagine deve
# essere buildata con ENABLE_TLS=false (non implementato: al momento il
# dev stack usa http://localhost). L'attuale config è prod-ready.

# ── Upstream backend ───────────────────────────────────────────────────────
upstream backend {
    server backend:8000;
    keepalive 16;
}


# ── HTTP server (porta 80) ─────────────────────────────────────────────────
# Serve solo ACME + healthcheck, redirige il resto su HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME HTTP-01 challenge per certbot renew (issue #16)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck locale (no TLS) — usato dal HEALTHCHECK del container nginx.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Tutto il resto → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}


# ── Common SSL + security header snippet (DRY tra i due server block) ─────
# nginx 1.27 non ha "include snippets/" custom out-of-the-box: duplichiamo
# le direttive in entrambi i server block. Cambia raramente.

# ── HTTPS server: SPA frontend (porta 443) ────────────────────────────────
# Su tms.wheretech.it: serve la SPA React + reverse proxy /api/* per
# permettere all'app di chiamare il backend con URL relativi (`/api/...`)
# e quindi senza preflight CORS extra. Stesso cookie domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tms.wheretech.it;

    ssl_certificate     /etc/letsencrypt/live/tms.wheretech.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tms.wheretech.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # HSTS: 2 anni + subdomains (no preload finche' nessun subdomain legacy).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Security headers (ridondanti con quelli del backend per asset statici).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: ogni rotta non-file ricade su index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aggressiva per asset hashati da CRA/Vite (pattern "*.HASH.ext").
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No-cache per index.html così un deploy nuovo è visto subito.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Reverse proxy verso backend per /api/* (URL relativi dell'app).
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # sovrascrive, anti-spoof (#59)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}


# ── HTTPS server: API endpoint (porta 443) ─────────────────────────────────
# Su api.tms.wheretech.it: SOLO reverse proxy verso backend.
# Niente SPA fallback: la root e i path non-`/api/*` ritornano un JSON
# informativo (404). Questo subdomain serve per:
#   - integrazioni esterne che invocano direttamente le API
#   - webhook in ingresso da provider GPS (#36) e sensori IoT (#38)
#   - presigned URL S3 firmati (#35) — ma quelli puntano direttamente a S3
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tms.wheretech.it;

    ssl_certificate     /etc/letsencrypt/live/tms.wheretech.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tms.wheretech.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Root + path non-API: 404 JSON informativo, NO SPA.
    location = / {
        default_type application/json;
        return 404 '{"error":"not_found","message":"This is the API host. See https://tms.wheretech.it for the application.","docs":"https://api.tms.wheretech.it/api/docs"}';
    }

    # Reverse proxy verso backend per /api/*
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Catch-all per path non noti: 404 JSON, mai SPA fallback.
    location / {
        default_type application/json;
        return 404 '{"error":"not_found","message":"Endpoint not under /api/. This host serves only the backend API."}';
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
    gzip_min_length 1024;
}
