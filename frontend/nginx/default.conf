# Nginx: serve solo la SPA statica. TLS e proxy /api/* → backend-go sono
# gestiti dal reverse proxy dell'host (fuori da questo container), non qui.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Usato dal HEALTHCHECK del Dockerfile e/o dall'health-check dell'host proxy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: ogni rotta non-file ricade su index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aggressiva per asset hashati da Vite (pattern "*.HASH.ext").
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No-cache per index.html così un deploy nuovo è visto subito.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
