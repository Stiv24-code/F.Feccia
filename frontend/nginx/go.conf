# Nginx config per testare il frontend contro backend-go (Postgres), invece
# del backend Python. Usato dal servizio `frontend-go` in docker-compose.go.yml
# (override), non tocca il servizio `nginx` esistente (che resta sul backend
# Python) — i due stack possono girare in parallelo su porte diverse.
#
# Stessa struttura di frontend/nginx/dev.conf, con due differenze:
#   1. upstream punta a backend-go:8080 invece di backend:8000
#   2. il path viene riscritto da /api/... a /api/v1/... perché le route Go
#      vivono sotto /api/v1 mentre il frontend chiama URL relativi /api/...
#      (stesso base path usato per il backend Python, che monta invece a /api).

upstream backend_go {
    server backend-go:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Riscrittura path: /api/xxx -> /api/v1/xxx (nota la barra finale su
    # location E su proxy_pass: nginx sostituisce solo il prefisso "/api/"
    # matchato, non l'intero URI).
    location /api/ {
        proxy_pass http://backend_go/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
