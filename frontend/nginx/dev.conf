# Nginx config per sviluppo locale — nessun TLS.
#
# frontend/nginx/default.conf richiede i certificati Let's Encrypt montati
# solo da docker-compose.prod.yml (/etc/letsencrypt) e non parte in locale
# (nginx fallisce il config test su ssl_certificate mancante).
#
# Questo file sostituisce default.conf via bind-mount da
# docker-compose.dev.yml, senza toccare l'immagine di build né il config
# prod-ready. Stessa logica applicativa del server block SPA di
# default.conf, ma un solo server su porta 80, senza SSL né split
# tms.wheretech.it / api.tms.wheretech.it (non serve in locale).
#
# Instradato su backend-go (Postgres), non più sul backend Python — stesso
# stack finora provato solo via frontend-go/go.conf, ora promosso a default
# locale. Il backend Python resta nel compose file (servizio `backend`,
# spento se non esplicitamente avviato) finché non si completano gli altri
# passi del cutover (rimozione servizio + immagine + codice).

upstream backend_go {
    server backend-go:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Healthcheck del container nginx (Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: ogni rotta non-file ricade su index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aggressiva per asset hashati.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No-cache per index.html così un rebuild locale è visto subito.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Reverse proxy verso backend-go per /api/* (URL relativi dell'app).
    # Riscrittura path: /api/xxx -> /api/v1/xxx (nota la barra finale su
    # location E su proxy_pass: nginx sostituisce solo il prefisso "/api/"
    # matchato, non l'intero URI) — le route Go vivono sotto /api/v1.
    location /api/ {
        proxy_pass http://backend_go/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
