host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: fratelli-feccia backend API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: fratelli-feccia API
  version: "1.0"
paths:
  /api/v1/accessory-costs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AccessoryCostResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List accessory costs
      tags:
      - Masterdata
    post:
      consumes:
      - application/json
      parameters:
      - description: Accessory cost data
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/dto.AccessoryCostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AccessoryCostResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create accessory cost
      tags:
      - Masterdata
  /api/v1/accounting-entries:
    get:
      parameters:
      - description: Filter by codice/descrizione
        in: query
        name: search
        type: string
      - description: Filter by tipo (ricavo|costo)
        in: query
        name: tipo
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AccountingEntryResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List accounting entries
      tags:
      - Anagrafiche
    post:
      consumes:
      - application/json
      parameters:
      - description: Accounting entry data
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/dto.AccountingEntryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AccountingEntryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create accounting entry
      tags:
      - Anagrafiche
  /api/v1/accounting-entries/{id}:
    delete:
      parameters:
      - description: Accounting entry ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete accounting entry (logical, sets active=false)
      tags:
      - Anagrafiche
    put:
      consumes:
      - application/json
      parameters:
      - description: Accounting entry ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Accounting entry data
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/dto.AccountingEntryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountingEntryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update accounting entry (full replace)
      tags:
      - Anagrafiche
  /api/v1/admin/users:
    get:
      description: Full unpaginated roster with email/profile_id/active, mirrors admin.py's
        GET /admin/users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AuthUserResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List all users (frontend admin panel)
      tags:
      - Admin Users
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - Admin Users
  /api/v1/admin/users-list:
    get:
      description: Returns paginated list of users
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Admin Users
  /api/v1/admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
